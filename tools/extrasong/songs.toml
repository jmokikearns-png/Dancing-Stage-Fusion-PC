# The new songs for Dancing Stage Fusion PC and Deluxe, in song-table order
# (song 21 first).  A song keeps its save slot only while it keeps its place,
# so keep this order.
#
# Put your simfile packs of the PlayStation 2 and arcade versions of Dancing
# Stage Fusion in the folder with this file, as they come, and simfiles of
# Go West, It's Raining Men and PARANOIA survivor (in neither pack, marked
# below) from wherever you have them: each song is found
# in them by its title (and artist); its music, banner and background are the
# files its .sm names.  To use one particular folder instead, give the song
# dir = "path/to/its/folder"; to match another title too, find = ["..."].
#
# Build: python tools/extrasong/build_extrasong.py songs.toml DISC.cue OUT
# (the release: "Build New Songs.bat").
#
# stage = K: the song's own background animation on stage set K (1..17, not
# 11, one song each).  script = N instead: stock song N's, fitted to it.
# background / banner: your own picture instead of the simfile's.
[[song]]
stage = 1			# its own background animation, on stage set 1
# script = 18			# (or: 321STARS's, fitted to this song)
master_id = 0x8030
# background = "my-art/background.png"
title = "Tough Enough"
artist = "Vanilla Ninja"

[[song]]
stage = 10			# its own background animation, on stage set 10
# script = 19			# (or: Try 2 Luv. U's, fitted to this song)
