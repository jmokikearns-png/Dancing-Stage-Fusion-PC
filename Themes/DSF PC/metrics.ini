# Dancing Stage Fusion PC -- StepMania 2005 theme.
#
# The port's front end: title menu (Play / Options / Exit) and StepMania's own
# options, key/joy mapping and input test screens.  Everything not defined here
# falls back to Themes/default.
#
# The 2005-06-19 CVS snapshot's default theme is incomplete (the engine had moved
# ahead of it: themed enum strings, transitions and title menu items are missing
# upstream at that commit).  The [Difficulty]..[ScreenSystemLayer] sections and
# the BGAnimations/Fonts/Sounds here supply exactly those missing pieces.

[Global]
FallbackTheme=default

[Common]
InitialScreen=ScreenTitleMenu
FirstAttractScreen=ScreenTitleMenu
WindowTitle=Dancing Stage Fusion PC

