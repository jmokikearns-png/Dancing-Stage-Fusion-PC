Quit=Quit to Windows
Key Joy Mappings=Configure
Test Input=Open
Graphic Options=Open
Sound Options=Open
Exit=Exit
NextRow=Next Row

[OptionExplanations]
PS1 Resume=Back to the game, exactly where you left it.
PS1 Mappings=Bind keyboard keys, dance pads and joysticks for Player 1 and Player 2.
PS1 Sound=Volume, audio buffer and picture/sound sync.
PS1 Graphics=Window size, fullscreen and display settings.
PS1 Quit=Close Dancing Stage Fusion PC.  The game saves to its memory card itself.
SoundVolume=Master volume.
SoundWriteAhead=Smaller is less delay; raise it if the sound crackles.  Applies the next time you start.
PS1MatchPictureToSound=ON: show each frame when its sound is heard, so arrows match the music.
PS1SyncOffset=Fine-tune: positive shows the picture later, negative earlier.
Config Key/Joy Mappings=Bind keyboard keys, dance pads and joysticks for Player 1 and Player 2.
Test Input=Shows which buttons StepMania sees as you press them.
Graphic Options=Window size, fullscreen and display settings.
Sound Options=Volume and sound quality.
Exit=Back to the title menu.

