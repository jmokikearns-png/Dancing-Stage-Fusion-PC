[OptionNames]
Key Joy Mappings=Configure
Test Input=Open
Graphic Options=Open
Sound Options=Open
Exit=Exit
NextRow=Next Row

[OptionExplanations]
PS1InternalResolution=The game's 3D at higher resolution (its 2D art keeps its original pixels).  Applies the next time you start.
PS1OpenGL=OpenGL uses your graphics card (recommended); Software is slower above native.  Applies the next time you start.
PS1SmoothArrows=ON: the arrows move every frame (49.76 per second) instead of every other one.  Costs about twice the work during songs: turn it OFF if songs slow down.
Windowed=Window or full screen (also Alt+Enter).
DisplayResolution=Size of the window, or the full-screen mode.
RefreshRate=Full-screen refresh rate.
Vsync=Wait for the monitor between frames (smoother, slightly more delay).
SoundVolume=Master volume.
SoundWriteAhead=Smaller is less delay; raise it if the sound crackles.  Applies the next time you start.
PS1MatchPictureToSound=OFF: least delay (best for timing).  ON: show each frame when its sound is heard, so arrows match the music exactly.
PS1SyncOffset=Delays the picture by this much (try +10 to +40 ms if arrows look early against the music).
Config Key/Joy Mappings=Bind keyboard keys, dance pads and joysticks for Player 1 and Player 2.
Test Input=Shows which buttons StepMania sees as you press them.
Graphic Options=Window size, fullscreen and display settings.
Sound Options=Volume and sound quality.
Exit=Back to the title menu.

