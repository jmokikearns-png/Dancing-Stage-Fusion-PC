format_version = 5
id = "dsf.stepmania"
version = "1.0.0"
name = "StepMania integration"
author = "Dancing Stage Fusion PC"
description = "Hooks that make Dancing Stage Fusion's own code use the host StepMania 2005: the game's per-frame pad read takes both players' buttons from StepMania's input mapping instead of the emulated controller port."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLES-04163"

[[feature]]
id = "stepmania-pads"
name = "Buttons from StepMania"
description = "The game's pad-read routine (0x800243FC) gets the buttons straight from StepMania's key/joy mappings."
group = "Controls"
default_enabled = true

[[plugin]]
feature = "stepmania-pads"
id = "dsf.stepmania.pads"

[[feature]]
id = "stepmania-menus"
name = "PC settings in the game's OPTIONS"
description = "StepMania's sound, display and controller settings as extra rows in the game's own SOUND / GRAPHIC / CONTROLLER option screens."
group = "Controls"
default_enabled = true

[[plugin]]
feature = "stepmania-menus"
id = "dsf.stepmania.menus"

[[feature]]
id = "stepmania-quit"
name = "QUIT on the main menu"
description = "A QUIT entry under OPTIONS on the game's main menu, in the menu's own lettering, that leaves the program."
group = "Controls"
default_enabled = true

[[plugin]]
feature = "stepmania-quit"
id = "dsf.stepmania.quit"

[[feature]]
id = "stepmania-stepcolors"
name = "STEP MARK COLORS TYPE3"
description = "A third STEP MARK COLORS choice in GRAPHIC OPTIONS: TYPE2's colouring by note with DDR Solo's colours (4th orange, 8th cyan, 12th magenta, 16th and finer purple)."
group = "Graphics"
default_enabled = true

[[plugin]]
feature = "stepmania-stepcolors"
id = "dsf.stepmania.stepcolors"
